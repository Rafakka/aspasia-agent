<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Agentic loop: plan, human approval, search, select sources, fetch, synthesize — with revise and bounded retry feedback loops</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f65cf"/>
    </marker>
    <marker id="arAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf8a2e"/>
    </marker>
  </defs>

  <!-- card background -->
  <rect x="1" y="1" width="1118" height="498" rx="16" fill="#ffffff" stroke="#e3e1f0" stroke-width="2"/>

  <!-- ═══ feedback loops (drawn first, under nodes) ═══ -->
  <!-- revise: approve_plan → plan -->
  <path d="M 486,120 C 486,56 248,56 248,114" fill="none" stroke="#cf8a2e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arAmber)"/>
  <text x="367" y="60" text-anchor="middle" font-size="12.5" font-style="italic" fill="#b0791f" stroke="#ffffff" stroke-width="4" paint-order="stroke">revise: feedback → redraft plan</text>

  <!-- retry: fetch → search -->
  <path d="M 906,310 C 906,240 726,240 726,192" fill="none" stroke="#6f65cf" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="816" y="248" text-anchor="middle" font-size="12" font-style="italic" fill="#575086" stroke="#ffffff" stroke-width="4" paint-order="stroke">not enough sources:</text>
  <text x="816" y="264" text-anchor="middle" font-size="12" font-style="italic" fill="#575086" stroke="#ffffff" stroke-width="4" paint-order="stroke">broaden queries &amp; retry</text>

  <!-- ═══ main flow arrows ═══ -->
  <path d="M 120,152 L 170,152" stroke="#6f65cf" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 318,152 L 378,152" stroke="#6f65cf" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 586,152 L 648,152" stroke="#cf8a2e" stroke-width="2" marker-end="url(#arAmber)"/>
  <text x="618" y="139" text-anchor="middle" font-size="12" font-style="italic" fill="#b0791f" stroke="#ffffff" stroke-width="4" paint-order="stroke">approved</text>
  <path d="M 796,152 L 858,152" stroke="#6f65cf" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 956,184 L 956,302" stroke="#6f65cf" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 886,342 L 720,342" stroke="#6f65cf" stroke-width="2" marker-end="url(#ar)"/>
  <text x="800" y="330" text-anchor="middle" font-size="12" font-style="italic" fill="#2f7d4f" stroke="#ffffff" stroke-width="4" paint-order="stroke">enough sources ✓</text>
  <path d="M 536,342 L 480,342" stroke="#6f65cf" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ═══ input / output pills ═══ -->
  <rect x="28" y="128" width="92" height="48" rx="24" fill="#f7f6fc" stroke="#c7c2ea" stroke-width="2"/>
  <text x="74" y="157" text-anchor="middle" font-size="14" fill="#4a4470">topic</text>

  <rect x="230" y="318" width="242" height="48" rx="24" fill="#f7f6fc" stroke="#c7c2ea" stroke-width="2"/>
  <text x="351" y="347" text-anchor="middle" font-size="14" fill="#4a4470">report.md · full run trace</text>

  <!-- ═══ row 1 nodes ═══ -->
  <!-- plan -->
  <rect x="178" y="120" width="140" height="64" rx="10" fill="#f2f0ff" stroke="#9187e8" stroke-width="2"/>
  <text x="248" y="147" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0.5" fill="#232047">PLAN</text>
  <text x="248" y="166" text-anchor="middle" font-size="11.5" fill="#6f6a8f">queries + outline</text>
  <circle cx="178" cy="120" r="11" fill="#6b5cd6"/>
  <text x="178" y="124.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>

  <!-- approve_plan (human gate) -->
  <rect x="386" y="120" width="200" height="64" rx="10" fill="#fff3d6" stroke="#e0a94f" stroke-width="2"/>
  <circle cx="412" cy="143" r="5" fill="#b0791f"/>
  <path d="M 403,160 a 9,9 0 0 1 18,0 z" fill="#b0791f"/>
  <text x="496" y="147" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0.5" fill="#4a3410">HUMAN APPROVAL</text>
  <text x="496" y="166" text-anchor="middle" font-size="11.5" fill="#8a6a2f">pauses via interrupt()</text>
  <circle cx="386" cy="120" r="11" fill="#cf8a2e"/>
  <text x="386" y="124.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>

  <!-- search -->
  <rect x="656" y="120" width="140" height="64" rx="10" fill="#f2f0ff" stroke="#9187e8" stroke-width="2"/>
  <text x="726" y="147" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0.5" fill="#232047">SEARCH</text>
  <text x="726" y="166" text-anchor="middle" font-size="11.5" fill="#6f6a8f">run planned queries</text>
  <circle cx="656" cy="120" r="11" fill="#6b5cd6"/>
  <text x="656" y="124.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>

  <!-- select_sources -->
  <rect x="866" y="120" width="180" height="64" rx="10" fill="#f2f0ff" stroke="#9187e8" stroke-width="2"/>
  <text x="956" y="147" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0.5" fill="#232047">SELECT SOURCES</text>
  <text x="956" y="166" text-anchor="middle" font-size="11.5" fill="#6f6a8f">triage citable URLs</text>
  <circle cx="866" cy="120" r="11" fill="#6b5cd6"/>
  <text x="866" y="124.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>

  <!-- ═══ row 2 nodes ═══ -->
  <!-- fetch -->
  <rect x="886" y="310" width="140" height="64" rx="10" fill="#f2f0ff" stroke="#9187e8" stroke-width="2"/>
  <text x="956" y="337" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0.5" fill="#232047">FETCH</text>
  <text x="956" y="356" text-anchor="middle" font-size="11.5" fill="#6f6a8f">download + extract</text>
  <circle cx="886" cy="310" r="11" fill="#6b5cd6"/>
  <text x="886" y="314.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>

  <!-- synthesize -->
  <rect x="536" y="310" width="176" height="64" rx="10" fill="#bfb6fc" stroke="#9187e8" stroke-width="2"/>
  <text x="624" y="337" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0.5" fill="#232047">SYNTHESIZE</text>
  <text x="624" y="356" text-anchor="middle" font-size="11.5" fill="#4a4470">write cited report</text>
  <circle cx="536" cy="310" r="11" fill="#6b5cd6"/>
  <text x="536" y="314.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6</text>

  <!-- ═══ legend ═══ -->
  <g font-size="12.5" fill="#6f6a8f">
    <path d="M 290,452 L 318,452" stroke="#6f65cf" stroke-width="2"/>
    <text x="326" y="456">main flow</text>
    <path d="M 420,452 L 448,452" stroke="#6f65cf" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="456" y="456">feedback loops (bounded)</text>
    <rect x="626" y="444" width="18" height="16" rx="4" fill="#fff3d6" stroke="#e0a94f" stroke-width="1.5"/>
    <text x="652" y="456">human-in-the-loop gate</text>
  </g>
</svg>
